[phases.setup]
nixPkgs = "php82", '"php82Packages.composer", "php82Extensions.pdo", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.zip", "php82Extensions.gd", "php82Extensions.bcmath"]

[phases.install]
cmds = ["composer install --no-dev --optimise-autoloader"]

[phases.build]
cmds = ["php artisan config:clear", "php artisan migrate --force", "npm install && npm run build"]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT'
